services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
      no_cache: true
    container_name: vista-agent-mcp
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro 
    environment:
      - TZ=America/Vancouver
      # sa-staging serves a cert whose SAN doesn't cover its own hostname (`curl` fails,
      # `curl -k` works), so the log fetch can't verify it. Skip verification for that host
      # only — every other host stays fully verified. Drop this once the cert is fixed.
      - MCP_FETCH_INSECURE_TLS_HOSTS=sa-staging.corp.fortinet.com
      # Preferred alternative when a host is merely signed by an internal CA: trust the CA
      # instead of skipping verification (mount the PEM in via `volumes:` above).
      # - MCP_FETCH_CA_BUNDLE=/etc/ssl/certs/fortinet-corp-ca.pem
    networks:
      - vista-int
    command: uv run server.py
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.1.113:3100/loki/api/v1/push"
        mode: non-blocking
 
networks:
  vista-int:
    name: vista-int
    external: true 