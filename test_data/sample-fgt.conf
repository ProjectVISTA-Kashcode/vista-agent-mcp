#config-version=FGT60F-7.4.4-FW-build2662-240514:opmode=0:vdom=0
#conf_file_ver=1
#buildno=2662
#global_vdom=1
config system global
    set admintimeout 30
    set alias "FGT-BRANCH-AUSTIN"
    set hostname "FGT-BRANCH-AUSTIN"
    set timezone 04
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 203.0.113.10 255.255.255.0
        set allowaccess ping https ssh
        set alias "WAN1-ISP-A"
        set role wan
    next
    edit "port2"
        set vdom "root"
        set ip 198.51.100.10 255.255.255.0
        set allowaccess ping
        set alias "WAN2-ISP-B"
        set role wan
    next
    edit "port3"
        set vdom "root"
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping https ssh
        set alias "LAN"
        set role lan
    next
end
config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
    end
    config members
        edit 1
            set interface "port1"
            set gateway 203.0.113.1
            set priority 10
        next
        edit 2
            set interface "port2"
            set gateway 198.51.100.1
            set priority 20
        next
    end
    config health-check
        edit "Austin"
            set server "8.8.8.8"
            set protocol ping
            set interval 500
            set failtime 5
            set recoverytime 10
            set members 1 2
            config sla
                edit 1
                    set link-cost-factor latency packet-loss
                    set latency-threshold 200
                    set packetloss-threshold 2
                next
            end
        next
    end
    config service
        edit 1
            set name "Critical-Apps"
            set mode sla
            set dst "all"
            set src "LAN_SUBNET"
            config sla
                edit "Austin"
                    set id 1
                next
            end
            set priority-members 1 2
        next
    end
end
config router bgp
    set as 65001
    set router-id 10.10.10.1
    set ebgp-multipath enable
    config neighbor
        edit "203.0.113.1"
            set remote-as 65000
            set soft-reconfiguration enable
        next
        edit "198.51.100.1"
            set remote-as 65010
            set soft-reconfiguration enable
        next
    end
    config network
        edit 1
            set prefix 10.10.10.0 255.255.255.0
        next
    end
end
config router static
    edit 1
        set gateway 203.0.113.1
        set device "port1"
    next
end
config vpn ipsec phase1-interface
    edit "HQ-TUNNEL"
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal aes256-sha256
        set dhgrp 14
        set remote-gw 192.0.2.50
        set psksecret ENC XXXXXXXXXXXXXXXX
    next
end
config vpn ipsec phase2-interface
    edit "HQ-TUNNEL-P2"
        set phase1name "HQ-TUNNEL"
        set proposal aes256-sha256
        set dhgrp 14
        set auto-negotiate enable
    next
end
config firewall address
    edit "LAN_SUBNET"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "HQ_SUBNET"
        set subnet 172.16.0.0 255.255.0.0
    next
end
config firewall policy
    edit 1
        set name "LAN-to-WAN"
        set srcintf "port3"
        set dstintf "virtual-wan-link"
        set action accept
        set srcaddr "LAN_SUBNET"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 2
        set name "LAN-to-HQ"
        set srcintf "port3"
        set dstintf "HQ-TUNNEL"
        set action accept
        set srcaddr "LAN_SUBNET"
        set dstaddr "HQ_SUBNET"
        set schedule "always"
        set service "ALL"
    next
end
