[project]
name = "vista-agent-mcp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4,<4",
    "httpx>=0.27",
    "pydantic>=2",
    "python-dotenv>=1.0",
    # Durable job history + GUI dashboard/history. Optional at runtime: without it (or without
    # DATABASE_URL) the server runs exactly as before, with the live in-memory view only.
    "psycopg[binary,pool]>=3.1",
    # Every AI step in the orchestrator is a typed Pydantic AI agent (routing + invocation
    # planning, result rendering, tool-config drafting) against the OpenAI-compatible
    # AgentAssist gateway. The [openai] extra brings the OpenAI-protocol model/provider.
    "pydantic-ai-slim[openai]>=2.0",
]
